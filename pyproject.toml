[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmacm-block-dp"
version = "1.0.0"
description = "Minimum-weight maximal acyclic matchings on cycle/complete-multipartite block graphs"
requires-python = ">=3.10"
dependencies = ["networkx>=3.1"]
authors = [{name = "Hao Tang", email = "tanghao5524@mails.jlu.edu.cn"}]
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.7"]

[project.scripts]
mmacm = "mmacm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
